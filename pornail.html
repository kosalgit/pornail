<style>
/* Layout: a shade wall of polish colours opens the page, then supplies shop, salon price list, booking, store info.
   Identity: the colours themselves. Everything else stays quiet. */
:root {
  --bg: #FBF6F6;
  --surface: #FFFFFF;
  --fg: #2B1722;
  --muted: #7A6670;
  --line: #EBDADF;
  --accent: #B3124F;
  --accent-fg: #FFFFFF;
  --accent-soft: #F8E3EA;
  --ok: #1F7A55;
  --font-display: "Koulen", "Kantumruy Pro", "Noto Sans Khmer", sans-serif;
  --font-body: "Kantumruy Pro", "Noto Sans Khmer", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A0F15; --surface: #25161F; --fg: #F6E9EE; --muted: #B79AA6;
    --line: #3A2530; --accent: #FF6B9D; --accent-fg: #1A0F15; --accent-soft: #3A1B29; --ok: #5ED3A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A0F15; --surface: #25161F; --fg: #F6E9EE; --muted: #B79AA6;
  --line: #3A2530; --accent: #FF6B9D; --accent-fg: #1A0F15; --accent-soft: #3A1B29; --ok: #5ED3A0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; letter-spacing: 0.01em; line-height: 1.25; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.placeholder { border-bottom: 1.5px dashed var(--muted); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.brand { font-family: var(--font-display); font-size: 26px; text-decoration: none; color: var(--accent); margin-right: auto; line-height: 1.2; }
.brand small { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--muted); margin-left: 6px; text-transform: lowercase; }
.latin { font-family: var(--font-body); font-weight: 600; font-size: 18px; letter-spacing: .28em; color: var(--muted); margin-top: 2px; }
.nav { display: flex; gap: 20px; }
.nav a { text-decoration: none; font-weight: 500; font-size: 15px; color: var(--muted); }
.nav a:hover { color: var(--fg); }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.cartbtn {
  display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.cartbtn b { background: var(--accent); color: var(--accent-fg); min-width: 22px; height: 22px; border-radius: 11px; display: inline-grid; place-items: center; font-size: 12px; padding: 0 6px; font-variant-numeric: tabular-nums; }

/* hero */
main { display: flex; flex-direction: column; gap: 88px; padding-block: 40px 56px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(52px, 9vw, 96px); color: var(--accent); line-height: 1.15; }
.hero .lede { font-size: 20px; font-weight: 600; margin-top: 14px; max-width: 28ch; text-wrap: balance; }
.hero .sub { color: var(--muted); margin-top: 12px; max-width: 46ch; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-fg); padding: 10px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sw { border-radius: var(--radius); aspect-ratio: 3 / 4; padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; font-size: 11px; line-height: 1.3; font-variant-numeric: tabular-nums; position: relative; overflow: hidden; transition: transform .2s; }
.sw:hover { transform: translateY(-4px); }
.sw::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 38%; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
.sw.light { color: #2B1722; }
.sw b { font-size: 12px; letter-spacing: .03em; position: relative; }
.sw span { position: relative; opacity: .9; }
.wallcap { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }

/* sections */
.sec-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.sec-head h2 { font-size: clamp(30px, 5vw, 42px); }
.sec-head p { color: var(--muted); }
.chip-sample { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; vertical-align: middle; font-family: var(--font-body); letter-spacing: 0; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 500; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .art { aspect-ratio: 4 / 3; display: grid; place-items: center; }
.card .art svg { width: 44%; height: auto; max-height: 82%; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card h3 { font-size: 15px; font-weight: 600; line-height: 1.45; }
.card .meta { color: var(--muted); font-size: 13px; }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; gap: 8px; }
.price { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.add { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 4px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
.add:hover { background: var(--accent); color: var(--accent-fg); }

/* services */
.svc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.svc-list { list-style: none; margin: 0; padding: 0; }
.svc-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.svc-list li:first-child { border-top: 1px solid var(--line); }
.svc-list .n { font-weight: 600; }
.svc-list .d { color: var(--muted); font-size: 14px; grid-column: 1; }
.svc-list .p { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; grid-row: 1; grid-column: 2; }

/* booking */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.panel h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin-bottom: 16px; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
label { font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.result { margin-top: 18px; display: none; flex-direction: column; gap: 10px; }
.result.on { display: flex; }
.msg { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--muted); border-radius: 8px; padding: 12px 14px; font-size: 14px; overflow-wrap: anywhere; user-select: all; }
.hint { color: var(--muted); font-size: 14px; }
.err { color: var(--accent); font-size: 14px; font-weight: 600; }

/* store */
.store { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 24px; }
.store dt { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.store dd { margin: 4px 0 0; font-weight: 500; overflow-wrap: anywhere; }
footer { border-top: 1px solid var(--line); padding-block: 24px 40px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,8,14,.45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 50; background: var(--bg); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 20px; gap: 12px;
}
.drawer header { display: flex; align-items: center; justify-content: space-between; }
.drawer h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.x { border: 0; background: none; cursor: pointer; font-size: 28px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.lines { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.lines li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dot { width: 10px; height: 40px; border-radius: 5px; }
.ln { font-size: 14px; font-weight: 500; }
.lm { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.qty span { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.tot { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 24px 0; }

@media (max-width: 860px) {
  main { gap: 64px; padding-block-start: 28px; }
  .hero, .svc-wrap { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .nav { display: none; }
}
@media (max-width: 520px) {
  form { grid-template-columns: minmax(0, 1fr); }
  .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .wall .sw:nth-child(n+10) { display: none; }
  .panel { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

    $("make-order").style.opacity = rows.length ? "1" : ".5";
  }

  function openCart() { $("scrim").hidden = false; $("drawer").hidden = false; $("close-cart").focus(); }
  function closeCart() { $("scrim").hidden = true; $("drawer").hidden = true; $("o-result").classList.remove("on"); $("open-cart").focus(); }

  function copyText(text, btn) {
    var done = function () { var o = btn.textContent; btn.textContent = t("copied"); setTimeout(function () { btn.textContent = o; }, 1600); };
    var fallback = function (el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
    try {
      navigator.clipboard.writeText(text).then(done, function () { fallback(btn.previousElementSibling); });
    } catch (e) { fallback(btn.previousElementSibling); }
  }

  function renderAll() { applyText(); renderWall(); renderFilters(); renderGrid(); renderServices(); renderCart(); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cat) { cat = b.dataset.cat; renderFilters(); renderGrid(); }
    else if (b.dataset.add) { cart[b.dataset.add] = (cart[b.dataset.add] || 0) + 1; saveCart(); renderCart(); }
    else if (b.dataset.inc) { cart[b.dataset.inc]++; saveCart(); renderCart(); $("o-result").classList.remove("on"); }
    else if (b.dataset.dec) { cart[b.dataset.dec]--; if (cart[b.dataset.dec] <= 0) delete cart[b.dataset.dec]; saveCart(); renderCart(); $("o-result").classList.remove("on"); }
  });

  $("lang-km").addEventListener("click", function () { lang = "km"; try { localStorage.setItem("pk-lang", lang); } catch (e) {} renderAll(); });
  $("lang-en").addEventListener("click", function () { lang = "en"; try { localStorage.setItem("pk-lang", lang); } catch (e) {} renderAll(); });
  $("open-cart").addEventListener("click", openCart);
  $("close-cart").addEventListener("click", closeCart);
  $("scrim").addEventListener("click", closeCart);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeCart(); });

  $("make-order").addEventListener("click", function () {
    var rows = cartRows(), total = 0;
    var lines = rows.map(function (r) { total += r.n * r.p.p; return "• " + r.p[lang] + " × " + r.n + " = " + money(r.n * r.p.p); });
    $("o-msg").textContent = t("order_head") + "\n" + lines.join("\n") + "\n" + t("total") + ": " + money(total);
    $("o-result").classList.add("on");
  });
  $("o-copy").addEventListener("click", function () { copyText($("o-msg").textContent, $("o-copy")); });

  $("book-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("b-name").value.trim(), phone = $("b-phone").value.trim(), date = $("b-date").value;
    if (!name || !phone || !date) { $("b-err").textContent = t("err"); $("b-err").hidden = false; return; }
    $("b-err").hidden = true;
    var s = S[+$("b-svc").value], note = $("b-note").value.trim();
    var msg = t("book_head") + "\n" +
      t("f_name") + ": " + name + "\n" + t("f_phone") + ": " + phone + "\n" +
      t("f_service") + ": " + s[lang] + " (" + s.p + ")\n" +
      t("f_date") + ": " + date + "  " + $("b-time").value + (note ? "\n" + t("f_note").replace(/ \(.*\)/, "") + ": " + note : "");
    $("b-msg").textContent = msg;
    $("b-result").classList.add("on");
  });
  $("b-copy").addEventListener("click", function () { copyText($("b-msg").textContent, $("b-copy")); });

  var d = new Date(), pad = function (n) { return (n < 10 ? "0" : "") + n; };
  $("b-date").min = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  renderTimes();
  renderAll();
})();
</script>

</body></html>
